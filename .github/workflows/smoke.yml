name: "Smoke Checks"

"on":
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/smoke.yml"
      - "tests/env_tests/**"
      - "inventory/**"
      - "scripts/validate_manifest.py"
  pull_request:
    branches:
      - "master"
    paths:
      - ".github/workflows/smoke.yml"
      - "tests/env_tests/**"
      - "inventory/**"
      - "scripts/validate_manifest.py"
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: "Run environment smoke checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Validate inventory manifest when present"
        run: |
          python -m pip install --upgrade pip
          pip install 'jsonschema>=4.20,<5'
          if [ -f inventory/manifest_schema.json ] && [ -f inventory/combined_inventory.json ]; then
            python scripts/validate_manifest.py
          else
            echo "No manifest/schema pair found; skipping manifest validation."
          fi


      - name: "Run smoke check"
        run: |
          set -o pipefail
          python tests/env_tests/smoke_check.py

      - name: "Upload smoke report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "smoke-reports-${{ github.run_id }}"
          path: "tests/env_tests/smoke_report_*.json"
          if-no-files-found: warn
          retention-days: 14

      - name: "Create or update scheduled smoke incident"
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Smoke check failure';
            const dir = 'tests/env_tests';
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir)
                  .filter((name) => name.startsWith('smoke_report_') && name.endsWith('.json'))
                  .sort()
              : [];

            let body = [
              'Scheduled Harmonia smoke check failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.runId}`,
            ].join('\n');

            if (files.length) {
              body += '\n\nRecent smoke reports:\n';
              for (const file of files.slice(-3)) {
                body += `- ${dir}/${file}\n`;
              }
            }

            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10,
            });

            const existing = search.data.items.find(
              (item) => !item.pull_request && item.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated existing smoke incident #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.notice(`Created smoke incident #${created.data.number}`);
            }
