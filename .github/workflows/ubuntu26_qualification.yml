name: Ubuntu 26.04 Qualification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: ubuntu26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"

jobs:
  app:
    name: App qualification on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all
        run: pnpm lint:all

      - name: Test all
        run: pnpm test:all

      - name: Strict TypeScript check
        run: pnpm typecheck

      - name: Build all
        run: pnpm build:all

  python:
    name: Python ${{ matrix.python-version }} on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip curl

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ubuntu26-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ubuntu26-pip-${{ matrix.python-version }}-

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run pytest
        run: >-
          python -m pytest -q scripts/tests
          -k "not test_environment_packages and
          not test_docker_build_worker_image"

  mongoose:
    name: MongoDB models on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/harmonia_test

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval
          'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MongoDB model test
        run: pnpm test:mongo
