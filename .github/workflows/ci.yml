name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_docker_build:
        description: "If true, run the optional Docker build job"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  app:
    name: App qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint all
        run: pnpm lint:all
      - name: Test all
        run: pnpm test:all
      - name: Build all
        run: pnpm build:all

  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip curl
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Run pytest
        run: python -m pytest -q scripts/tests -k "not test_environment_packages and not test_docker_build_worker_image"

  docker_build:
    name: Optional worker Docker build
    runs-on: ubuntu-latest
    needs: [app, python]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_docker_build == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build worker Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: harmonia/worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test built image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts/ci/smoke.py:/tmp/smoke.py" \
            harmonia/worker:ci python3 /tmp/smoke.py
