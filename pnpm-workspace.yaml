packages:
  - .
  - packages/*

overrides:
  axios: 1.18.1
  fast-xml-parser: 5.7.0

  # Security Batch 2 — runtime-compatible major lines only.
  # Do not replace legacy major versions used by dev tooling.
  'multer@>=2.0.0 <2.3.0': 2.3.0
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.0
  'engine.io@>=6.0.0 <6.6.7': 6.6.7
  'socket.io-parser@>=4.0.0 <4.2.7': 4.2.7
  'ws@>=8.0.0 <8.21.0': 8.21.0

  # Security Batch 3 — remaining production-high findings.
  # Same-major, vulnerable-range-scoped overrides only.
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'lodash@>=4.0.0 <4.18.1': 4.18.1
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'ip-address@>=10.0.0 <10.3.1': 10.3.1

  # Security Batch 4 — dev/build criticals with same-line patches.
  'handlebars@>=4.0.0 <4.7.9': 4.7.9
  'websocket-driver@<0.7.5': 0.7.5

  # Security Batch 5 — tar 7.x advisory floor only.
  'tar@>=7.0.0 <7.5.21': 7.5.21

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  mongodb-memory-server: true
  '@parcel/watcher@2.5.1 || 2.6.0': true
  'unrs-resolver@1.11.1 || 1.12.2': true
  '@swc/core@1.5.29': true
  'esbuild@0.25.9 || 0.25.12 || 0.27.0 || 0.28.1': true
  'lmdb@3.4.2': true
  'msgpackr-extract@3.0.3': true
  'nx@22.7.12': true

strictDepBuilds: true

# Corepack pins pnpm; disable pnpm's internal version-manager env lockfile.
pmOnFail: ignore
