packages:
  - .
  - packages/*

overrides:
  axios: 1.18.1
  fast-xml-parser: 5.7.0

  # Security Batch 2 — runtime-compatible major lines only.
  # Do not replace legacy major versions used by dev tooling.
  'multer@>=2.0.0 <2.3.0': 2.3.0
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.0
  'engine.io@>=6.0.0 <6.6.7': 6.6.7
  'socket.io-parser@>=4.0.0 <4.2.7': 4.2.7
  'ws@>=8.0.0 <8.21.0': 8.21.0

  # Security Batch 3 — remaining production-high findings.
  # Same-major, vulnerable-range-scoped overrides only.
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'lodash@>=4.0.0 <4.18.1': 4.18.1
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'ip-address@>=10.0.0 <10.3.1': 10.3.1

  # Security Batch 4 — dev/build criticals with same-line patches.
  'handlebars@>=4.0.0 <4.7.9': 4.7.9
  'websocket-driver@<0.7.5': 0.7.5

  # Security Batch 5 — tar 7.x advisory floor only.
  'tar@>=7.0.0 <7.5.21': 7.5.21

  # Security Batch 6 — backend JWT verification patch.
  'jws@>=3.0.0 <3.2.3': 3.2.3

  # Security Batch 8A — remove vulnerable serialize-javascript
  # through the patched terser-webpack-plugin 5.x parent.
  'terser-webpack-plugin@>=5.0.0 <5.3.17': 5.3.17

  # Security Batch 8B — isolate the adm-zip 0.6.1 security floor
  # to the two Module Federation DTS-plugin parent versions.
  # Avoid a global adm-zip override or Module Federation upgrade.
  '@module-federation/dts-plugin@0.21.6>adm-zip': 0.6.1
  '@module-federation/dts-plugin@2.9.1>adm-zip': 0.6.1

  # CI stability — keep node-gyp on the vetted Undici 6.x security floor.
  # Avoids minimum-release-age rejection of same-day transitive releases.
  'node-gyp@12.4.0>undici': 6.28.1

  # Security Batch 7 — safe same-major tooling advisory floors.
  'minimatch@>=3.0.0 <3.1.4': 3.1.4
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'minimatch@>=10.0.0 <10.2.3': 10.2.3

  'brace-expansion@>=1.0.0 <1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  '@isaacs/brace-expansion@>=5.0.0 <5.0.1': 5.0.1

  'flatted@>=3.0.0 <3.4.2': 3.4.2

  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4

  'immutable@>=5.0.0 <5.1.8': 5.1.8
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'postcss@>=8.0.0 <8.5.18': 8.5.18
  'browserslist@>=4.0.0 <4.28.7': 4.28.7

  'node-forge@>=1.0.0 <1.4.0': 1.4.0
  'koa@>=3.0.0 <3.1.2': 3.1.2

  'path-to-regexp@>=0.1.0 <0.1.13': 0.1.13

  '@babel/plugin-transform-modules-systemjs@>=7.0.0 <7.29.4': 7.29.4

  'smol-toml@>=1.0.0 <1.7.1': 1.7.1

  # Security refresh — jsdiff 4.x DoS patched floor.
  'diff@>=4.0.0 <4.0.4': 4.0.4

  # Security refresh — qs 6.x DoS patched floor.
  'qs@>=6.0.0 <6.16.0': 6.16.0

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  mongodb-memory-server: true
  '@parcel/watcher@2.5.1 || 2.6.0': true
  'unrs-resolver@1.11.1 || 1.12.2': true
  '@swc/core@1.5.29': true
  'esbuild@0.25.9 || 0.25.12 || 0.27.0 || 0.28.1': true
  'lmdb@3.4.2': true
  'msgpackr-extract@3.0.3': true
  'nx@22.7.12': true

strictDepBuilds: true

# Corepack pins pnpm; disable pnpm's internal version-manager env lockfile.
pmOnFail: ignore
